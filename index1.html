<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07060e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>星空情书</title>
<!--
================================================================
  ✦ 只需要改文件底部脚本里最上面的 CONFIG 对象 ✦
  1) boy / girl       → 两个名字，页面上所有称呼都跟着变
  2) startDate        → 在一起的日期，会自动算「第几天」
  3) memories[]       → 每一段回忆 = 一屏（照片 + 日期 + 标题 + 一句话）
                        photo 留空就是虚线占位框；填 "photos/1.jpg" 就显示照片
  4) 结尾文案          → endLine / endSign，随便改
  5) letter           → 藏在名字中间那个「×」里的一封信（点 × 才打开）
  照片建议：新建 photos 文件夹，把照片放进去，写 "photos/1.jpg"
================================================================
-->
<style>
:root{
  --pink:#ffc2d6;
  --rose:#ff8fb1;
  --ink:#f8ecf2;
  --dim:rgba(248,236,242,.60);
  --hand:"Kaiti SC","STKaiti","KaiTi","楷体","LXGW WenKai","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --vh:1vh;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;background:#07060e;color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0}

/* ---------- 背景星空 ---------- */
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% -8%, rgba(255,143,177,.13), transparent 62%),
    radial-gradient(90% 60% at 12% 104%, rgba(124,96,255,.16), transparent 70%),
    radial-gradient(100% 100% at 50% 50%, transparent 42%, rgba(3,2,8,.86) 100%);
}

/* ---------- 滚动容器 ---------- */
#story{
  position:relative;z-index:2;height:100vh;height:100dvh;
  overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#story::-webkit-scrollbar{display:none}

.scene{
  min-height:100vh;min-height:100svh;
  scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,2.6vh,26px);
  padding:calc(54px + env(safe-area-inset-top)) clamp(20px,6.4vw,34px) calc(48px + env(safe-area-inset-bottom));
  text-align:center;position:relative;
}

/* ---------- 文字 ---------- */
.hand{
  font-family:var(--hand);
  color:var(--ink);
  letter-spacing:.055em;
  line-height:2.02;
  text-shadow:0 0 22px rgba(255,170,205,.30), 0 0 60px rgba(255,140,180,.14);
}
.eyebrow{
  font-family:var(--sans);font-size:11px;letter-spacing:.42em;
  color:var(--dim);text-transform:uppercase;
}
.title{
  font-size:clamp(27px,7.8vw,36px);
  font-weight:400;letter-spacing:.12em;line-height:1.7;
}
.sub{font-size:clamp(15px,4.4vw,17px);color:var(--dim);max-width:19em}
.memo{font-size:clamp(17px,4.9vw,20px);max-width:17em}
.sub,.main,.finale .f1,.finale .f2{white-space:pre-line}

/* 渐显 */
.r{opacity:0;transform:translateY(16px);filter:blur(7px);
   transition:opacity 1s ease,transform 1.05s cubic-bezier(.19,.75,.22,1),filter 1s ease;
   transition-delay:calc(var(--i,0) * 210ms)}
.scene.in .r{opacity:1;transform:none;filter:none}

/* ---------- 首屏 ---------- */
.scene--open .title{margin-top:4px}
.tap-hint{
  position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));
  left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.3em;color:rgba(248,236,242,.42);
  animation:breathe 2.8s ease-in-out infinite;
}
.tap-hint i{
  width:1px;height:26px;background:linear-gradient(180deg,rgba(255,194,214,.9),transparent);
}
@keyframes breathe{0%,100%{opacity:.42;transform:translateY(0)}50%{opacity:.95;transform:translateY(4px)}}

/* ---------- 照片卡 ---------- */
.photo{
  position:relative;
  width:min(70vw,268px);
  background:linear-gradient(180deg,#fffaf7,#f6e8ee);
  padding:9px 9px 44px;
  border-radius:3px;
  transform:rotate(var(--rot,-1.6deg));
  box-shadow:
    0 18px 44px rgba(0,0,0,.55),
    0 0 0 .5px rgba(255,255,255,.55) inset,
    0 0 60px rgba(255,143,177,.16);
}
.photo::after{
  content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.55),transparent 42%);
  mix-blend-mode:screen;opacity:.55;
}
.frame{
  position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;
  border-radius:1px;background:#191228;
}
.frame img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.96) contrast(1.03)}
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;background:
    radial-gradient(70% 60% at 30% 20%,rgba(255,143,177,.20),transparent 60%),
    linear-gradient(160deg,#2a2042,#3a2140 60%,#1d1730);
  border:1px dashed rgba(255,194,214,.42);border-radius:1px;
}
.empty span{font-size:12px;letter-spacing:.22em;color:rgba(255,194,214,.9)}
.empty em{font-style:normal;font-size:10px;letter-spacing:.08em;color:rgba(248,236,242,.42)}
.photo figcaption{
  position:absolute;left:9px;right:9px;bottom:0;height:44px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px;
  color:#5b4150;
}
.photo .date{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:#a8879a}
.photo .cap{font-family:var(--hand);font-size:13px;letter-spacing:.06em;color:#6b4b5c;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 星座 ---------- */
.scene--constellation{gap:8px}
.cs-line{font-size:clamp(15px,4.3vw,17px);color:var(--dim);opacity:0;transition:opacity 1.2s ease}
.scene.in .cs-line[data-cs="1"]{opacity:1;transition-delay:.2s}
.scene.in .cs-line[data-cs="2"]{opacity:1;transition-delay:.9s}
.cs-space{position:relative;width:100%;height:clamp(190px,36vh,300px);display:flex;align-items:center;justify-content:center}
#heart{width:100%;height:100%;display:block}
.cs-name{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--hand);font-size:clamp(30px,9vw,42px);letter-spacing:.22em;
  color:#fff3f8;opacity:0;transform:scale(.94);
  text-shadow:0 0 24px rgba(255,143,177,.75),0 0 70px rgba(255,120,170,.45);
  transition:opacity 1.4s ease,transform 1.6s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;
}
.scene.in .cs-name{opacity:.96;transform:none;transition-delay:1.1s}

/* ---------- 结尾 ---------- */
.lead{font-size:clamp(14px,4vw,16px);color:var(--dim);letter-spacing:.2em}
.main{font-size:clamp(20px,5.6vw,24px);font-weight:400;line-height:2.1;max-width:16em}
.days{
  display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px;
  opacity:0;transition:opacity 1s ease
}
.scene.in .days{opacity:1;transition-delay:.9s}
.days b{
  font-family:var(--hand);font-weight:400;
  font-size:clamp(44px,13vw,60px);line-height:1;
  color:#fff;text-shadow:0 0 30px rgba(255,143,177,.6),0 0 80px rgba(255,120,170,.3);
  font-variant-numeric:tabular-nums;
}
.days span{font-size:12px;letter-spacing:.34em;color:var(--pink);margin-top:-2px}
.days em{font-style:normal;font-size:10.5px;letter-spacing:.26em;color:rgba(248,236,242,.36);margin-top:6px}

.actions{position:relative;width:min(100%,320px);height:54px;margin-top:10px}
.btn{
  position:absolute;top:0;height:54px;border-radius:999px;cursor:pointer;
  font-family:var(--sans);font-size:15px;letter-spacing:.16em;
  border:1px solid rgba(255,194,214,.4);
  transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .3s, opacity .5s, background .3s;
  -webkit-appearance:none;appearance:none;
}
.btn.yes{
  left:0;width:56%;color:#3a1726;
  background:linear-gradient(135deg,#ffe3ec,#ffb0c9 55%,#ff8fb1);
  box-shadow:0 10px 30px rgba(255,143,177,.42),0 0 0 1px rgba(255,255,255,.3) inset;
  font-weight:500;
}
.btn.yes:active{transform:scale(.95);box-shadow:0 4px 16px rgba(255,143,177,.35)}
.btn.dodge{
  right:0;width:40%;color:rgba(248,236,242,.64);
  background:rgba(255,255,255,.045);backdrop-filter:blur(6px);
}
.btn.dodge.floating{position:fixed;right:auto;width:120px;z-index:60;will-change:transform,left,top;transition:left .34s cubic-bezier(.2,.9,.3,1),top .34s cubic-bezier(.2,.9,.3,1),transform .3s,opacity .5s}

/* ---------- 落幕 ---------- */
.finale{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  padding:32px;background:radial-gradient(80% 70% at 50% 40%,rgba(40,16,44,.82),rgba(5,3,12,.97));
  opacity:0;pointer-events:none;transition:opacity 1.1s ease;
  backdrop-filter:blur(3px);
}
.finale.show{opacity:1;pointer-events:auto}
.finale-inner{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:420px}
.finale .f1{font-size:clamp(19px,5.4vw,23px);opacity:0;transform:translateY(14px);transition:all 1.2s ease .25s}
.finale .sign{
  font-family:var(--hand);font-weight:400;font-size:clamp(24px,7.4vw,30px);letter-spacing:.14em;
  color:#fff;opacity:0;transform:translateY(14px);transition:all 1.2s ease .8s;
  text-shadow:0 0 26px rgba(255,143,177,.7)
}
.finale .sign i{font-style:normal;color:var(--rose);padding:0 .18em;font-size:.8em}
/* 藏起来的那个 × —— 看起来只是乘号，其实是一封信的开关 */
.sig-x{
  font-family:inherit;font-size:.8em;line-height:1;color:var(--rose);
  background:none;border:0;padding:0 .18em;margin:0;cursor:pointer;vertical-align:baseline;
  -webkit-appearance:none;appearance:none;
  transition:transform .25s ease;
  animation:xglow 6.5s ease-in-out infinite;
}
.sig-x:active{transform:scale(.86)}
@keyframes xglow{
  0%,84%,100%{text-shadow:0 0 0 rgba(255,143,177,0)}
  90%{text-shadow:0 0 18px rgba(255,143,177,.95),0 0 42px rgba(255,143,177,.55)}
}
.finale .stamp{font-size:10.5px;letter-spacing:.34em;color:rgba(248,236,242,.42);opacity:0;transition:opacity 1.2s ease 1.25s}
.finale .f2{font-size:14px;color:var(--dim);opacity:0;transition:opacity 1.2s ease 1.6s}
.finale.show .f1,.finale.show .sign{opacity:1;transform:none}
.finale.show .stamp,.finale.show .f2{opacity:1}

/* ---------- 那封信 ---------- */
.letter{
  position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
  background:rgba(6,4,12,.74);backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .55s ease;
}
.letter.show{opacity:1;pointer-events:auto}
.paper{
  position:relative;width:min(100%,352px);max-height:78vh;overflow-y:auto;
  padding:28px 22px 30px;border-radius:3px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.55),transparent 26%),
    linear-gradient(165deg,#fffdf9,#fdf4f2 62%,#fbe7ea);
  box-shadow:
    0 30px 70px rgba(0,0,0,.62),
    0 0 0 .5px rgba(255,255,255,.7) inset,
    0 0 90px rgba(255,143,177,.30);
  color:#5b4150;
  transform:translateY(26px) rotate(-1.4deg) scale(.965);
  transition:transform .8s cubic-bezier(.18,.86,.22,1);
  scrollbar-width:none;
}
.paper::-webkit-scrollbar{display:none}
.letter.show .paper{transform:translateY(0) rotate(-.7deg) scale(1)}
.paper .to{
  font-family:var(--hand);font-size:17px;letter-spacing:.14em;color:#8d6277;margin-bottom:12px;
}
.paper .ln{
  font-family:var(--hand);font-size:clamp(14px,4.1vw,15.5px);line-height:2.06;letter-spacing:.03em;
  color:#5b4150;opacity:0;transform:translateY(8px);
  transition:opacity .95s ease var(--d,0s),transform .95s cubic-bezier(.2,.8,.2,1) var(--d,0s);
}
.paper .to.ln{font-size:17px;line-height:1.8;letter-spacing:.14em;color:#8d6277;margin-bottom:12px}
.letter.show .ln{opacity:1;transform:none}
.paper .gap{height:12px}
.paper .sig{
  margin-top:18px;margin-bottom:34px;text-align:right;font-family:var(--hand);font-size:14.5px;
  letter-spacing:.1em;color:#8d6277;
  opacity:0;transition:opacity 1.1s ease 3.1s;
}
.letter.show .paper .sig{opacity:1}
.paper .seal{
  position:absolute;right:24px;bottom:16px;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--hand);font-size:14px;color:#ffe6ee;
  background:radial-gradient(circle at 32% 28%,#ff9ebc,#e0607f 58%,#a83a58);
  box-shadow:0 4px 14px rgba(200,70,110,.45),0 0 0 1px rgba(255,255,255,.28) inset;
  opacity:0;transform:scale(.6) rotate(-12deg);
  transition:opacity .7s ease 3.45s,transform .9s cubic-bezier(.2,1.5,.4,1) 3.45s;
}
.letter.show .seal{opacity:1;transform:none}
.letter .hint{
  position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));
  text-align:center;font-size:10px;letter-spacing:.32em;color:rgba(248,236,242,.36);
  opacity:0;transition:opacity 1s ease .8s;
}
.letter.show .hint{opacity:1}

/* ---------- HUD ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:50;background:rgba(255,255,255,.05)}
#bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);
  background:linear-gradient(90deg,rgba(255,194,214,.15),#ff8fb1 55%,#fff0f5)}
#music{
  position:fixed;z-index:90;right:calc(16px + env(safe-area-inset-right));top:calc(18px + env(safe-area-inset-top));
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,194,214,.28);
  background:rgba(255,255,255,.05);backdrop-filter:blur(8px);color:var(--pink);
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .25s,opacity .4s;opacity:.75;
}
#music:active{transform:scale(.9)}
#music .wave{display:flex;align-items:flex-end;gap:2px;height:13px}
#music .wave b{width:2px;height:5px;background:currentColor;border-radius:1px;opacity:.9}
#music.on .wave b{animation:eq .9s ease-in-out infinite}
#music .wave b:nth-child(2){animation-delay:.18s}
#music .wave b:nth-child(3){animation-delay:.36s}
@keyframes eq{0%,100%{height:4px}50%{height:13px}}

@media (prefers-reduced-motion:reduce){
  .r{transition-duration:.01s}
  .tap-hint{animation:none}
}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="veil"></div>
<div id="bar"><i></i></div>

<button id="music" aria-label="背景音乐">
  <span class="wave"><b></b><b></b><b></b></span>
</button>

<main id="story">
  <!-- 1 开场 -->
  <section class="scene scene--open" id="s0">
    <p class="eyebrow r" style="--i:0">FOR <span data-bind="girl"></span></p>
    <h1 class="title hand r" style="--i:1">抬头，<br>星星都亮了</h1>
    <p class="sub r" style="--i:2" data-bind="openLine"></p>
    <div class="tap-hint"><i></i><span>轻触 · 下滑</span></div>
  </section>

  <!-- 回忆由 JS 生成 -->

  <!-- 星座 -->
  <section class="scene scene--constellation" id="sCs">
    <p class="cs-line hand" data-cs="1" data-bind="cs1"></p>
    <div class="cs-space">
      <canvas id="heart"></canvas>
      <div class="cs-name" data-bind="girl"></div>
    </div>
    <p class="cs-line hand" data-cs="2" data-bind="cs2"></p>
  </section>

  <!-- 结尾 -->
  <section class="scene scene--finale" id="sEnd">
    <p class="lead hand r" style="--i:0" data-bind="lead"></p>
    <h2 class="main hand r" style="--i:1" data-bind="main"></h2>
    <div class="days" id="days">
      <b id="dayNum">0</b>
      <span>天</span>
      <em>我们已经在一起</em>
    </div>
    <div class="actions">
      <button class="btn yes" id="btnYes" data-bind="btnYes"></button>
      <button class="btn dodge" id="btnDodge" data-bind="btnDodge"></button>
    </div>
  </section>
</main>

<div class="finale" id="finale">
  <div class="finale-inner">
    <p class="f1 hand" data-bind="endLine"></p>
    <h2 class="sign">
      <span data-bind="boy"></span><button class="sig-x" id="btnX" aria-label="一封信">×</button><span data-bind="girl"></span>
    </h2>
    <p class="stamp" id="stamp"></p>
    <p class="f2 hand" data-bind="endSign"></p>
  </div>
</div>

<!-- 那封信：点名字中间那个 × 才打开 -->
<div class="letter" id="letter" role="dialog" aria-modal="true" aria-label="一封信">
  <div class="paper">
    <div class="to ln" style="--d:.15s" id="letterTo"></div>
    <div id="letterBody"></div>
    <div class="sig" id="letterSign"></div>
    <div class="seal" id="letterSeal"></div>
  </div>
  <div class="hint">轻触空白处 · 收起</div>
</div>

<script>
/* ============================================================
   ★★★  只改这里  ★★★
   ============================================================ */
const CONFIG = {
  boy: '许慎恒',                 // 他的名字
  girl: '王志国',                // 她的名字
  startDate: '2023-9-16',     // 在一起的日期（自动算天数）

  // ♪ 背景音乐：把 mp3 放到 music/bgm.mp3（也可以换成自己的文件名）
  //    找不到文件 / 播放失败时，会自动回落到内置的合成旋律，不会哑掉
  //    想彻底不要文件音乐，把下面这行改成 ''
  music: 'music/bgm.mp3',
  musicVolume: 0.5,            // 0 ~ 1，手机上建议 0.4~0.6

  openLine: '往下滑，我把没说出口的话，\n都藏在星星里了。',

  // 回忆：每一条 = 一屏。photo 留空是占位框，填路径就显示照片
  memories: [
    {
      date: '2026.11.06',
      caption: '我们的第一束花',
      photo: 'photos/1.jpg',                       // 例：'photos/1.jpg'
      text: '那天有了你，我心里便有了星星。'
    },
    {
      date: '2026.11.11',
      caption: '我们跑步的合照',
      photo: 'photos/2.jpg',
      text: '有些瞬间我拍照不是为了纪念，\n是怕自己以后想不起来。'
    },
    {
      date: '2026.11.24',
      caption: '我们一起散步',
      photo: 'photos/3.jpg',
      text: '后来我才懂，幸福不用很高调，\n是你静静的牵我的手。'
    }
  ],

  cs1: '你把这几颗星连起来看看。',
  cs2: '是我的心。收件人，一直只有你。',

  lead: '所以这一次，不是告白。',
  main: '是我想再确认一次——\n以后每一片星空，都和你一起看，好不好？',

  btnYes: '好呀',
  btnDodge: '再想想',

  endLine: '星空归你，\n我也归你。',
  endSign: '—— 一直是我的人，别跑。',

  /* ★ 隐藏信件：点名字中间那个「×」才会掉出来
     空字符串 '' = 空一行段落 */
  letter: {
    to: '王志国：',
    lines: [
      '有些话当面对你说，总是说不完整；',
      '写下来的时候，反而一句都舍不得删。',
      '',
      '喜欢你笑起来眼睛会弯，',
      '喜欢你走路时非要牵着我的手，',
      '喜欢你跟全世界较劲，唯独对我心软。',
      '',
      '以前总觉得「以后」是个很空的词，',
      '现在一想到以后，画面里全是你——',
      '很多次星星，很多个冬天，',
      '还有很多顿一起吃的早饭。',
      '',
      '这封信没有别的事，',
      '只是想告诉你：',
      '我很喜欢你，',
      '比昨天多一点，比明天少一点。'
    ],
    seal: '恒'          // 信封上那枚火漆印章里的字
  }
};
/* ============================================================ */

(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 文本绑定 ---------- */
  $$('[data-bind]').forEach(el => {
    const k = el.dataset.bind;
    if (CONFIG[k] != null) el.textContent = CONFIG[k];
  });

  /* ---------- 生成回忆屏 ---------- */
  const story = $('#story');
  const anchor = $('#sCs');
  const memHTML = CONFIG.memories.map((m, i) => `
    <section class="scene scene--memory">
      <figure class="photo r" style="--i:0;--rot:${i % 2 ? '1.7deg' : '-1.8deg'}">
        <div class="frame">
          ${m.photo
            ? `<img src="${m.photo}" alt="${(m.caption || '').replace(/"/g, '')}" loading="lazy">`
            : `<div class="empty"><span>照片位 ${i + 1}</span><em>把照片放进 photos/</em></div>`}
        </div>
        <figcaption><span class="date">${m.date || ''}</span><span class="cap">${m.caption || ''}</span></figcaption>
      </figure>
      <p class="memo hand r" style="--i:1">${(m.text || '').replace(/\n/g, '<br>')}</p>
    </section>`).join('');
  anchor.insertAdjacentHTML('beforebegin', memHTML);

  /* ---------- 逐屏显现 + 震动 ---------- */
  const scenes = $$('.scene');
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.intersectionRatio > .55 && !en.target.classList.contains('in')) {
        en.target.classList.add('in');
        try { navigator.vibrate && navigator.vibrate(9); } catch (e) {}
      }
    });
  }, { threshold: [.55] });
  scenes.forEach(s => io.observe(s));
  setTimeout(() => scenes[0].classList.add('in'), 160);

  /* ---------- 星空 canvas ---------- */
  const sky = $('#sky');
  const sctx = sky.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let stars = [], meteors = [], parts = [];

  function sizeSky() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = sky.clientWidth; H = sky.clientHeight;
    sky.width = W * DPR; sky.height = H * DPR;
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
    fitHeart();
  }

  function buildStars() {
    const n = reduce ? 70 : Math.round(clamp(W * H / 5200, 90, 210));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.25 + .35,
      a: Math.random() * .55 + .25,
      sp: Math.random() * 1.6 + .35,
      ph: Math.random() * Math.PI * 2,
      d: Math.random(),               // 视差深度
      hue: Math.random() > .82 ? 'pink' : 'white'
    }));
  }

  let scrollP = 0;
  function drawSky(t) {
    sctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const tw = .55 + .45 * Math.sin(t * .0011 * s.sp + s.ph);
      const y = s.y - scrollP * s.d * 46;
      const yy = ((y % H) + H) % H;
      sctx.beginPath();
      sctx.arc(s.x + scrollP * s.d * 10, yy, s.r * (1 + tw * .18), 0, 6.2832);
      sctx.fillStyle = s.hue === 'pink'
        ? `rgba(255,190,215,${s.a * tw})`
        : `rgba(255,250,246,${s.a * tw})`;
      sctx.fill();
      if (s.r > 1.2) {
        sctx.beginPath();
        sctx.arc(s.x + scrollP * s.d * 10, yy, s.r * 3.6, 0, 6.2832);
        sctx.fillStyle = s.hue === 'pink' ? `rgba(255,150,190,${s.a * tw * .10})` : `rgba(200,220,255,${s.a * tw * .07})`;
        sctx.fill();
      }
    }
    // 流星
    if (!reduce && Math.random() < .0032) {
      meteors.push({ x: Math.random() * W, y: Math.random() * H * .5, v: Math.random() * 5 + 6, life: 1 });
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.v; m.y += m.v * .48; m.life -= .012;
      if (m.life <= 0) { meteors.splice(i, 1); continue; }
      const g = sctx.createLinearGradient(m.x, m.y, m.x - 70, m.y - 34);
      g.addColorStop(0, `rgba(255,240,245,${m.life * .9})`);
      g.addColorStop(1, 'rgba(255,200,220,0)');
      sctx.strokeStyle = g; sctx.lineWidth = 1.4; sctx.lineCap = 'round';
      sctx.beginPath(); sctx.moveTo(m.x, m.y); sctx.lineTo(m.x - 70, m.y - 34); sctx.stroke();
    }
    // 尾声粒子
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .992; p.rot += p.vr; p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      sctx.save();
      sctx.translate(p.x, p.y); sctx.rotate(p.rot);
      sctx.globalAlpha = Math.min(1, p.life);
      sctx.fillStyle = p.c;
      if (p.type === 'heart') heartPath(sctx, p.s, p.s * .9);
      else { sctx.beginPath(); sctx.arc(0, 0, p.s * .42, 0, 6.2832); sctx.fill(); }
      sctx.restore();
    }
  }

  function heartPath(c, w, h) {
    c.beginPath();
    c.moveTo(0, h * .3);
    c.bezierCurveTo(0, -h * .1, -w, -h * .25, -w, h * .12);
    c.bezierCurveTo(-w, h * .5, -w * .3, h * .75, 0, h);
    c.bezierCurveTo(w * .3, h * .75, w, h * .5, w, h * .12);
    c.bezierCurveTo(w, -h * .25, 0, -h * .1, 0, h * .3);
    c.fill();
  }

  /* ---------- 星座心 ---------- */
  const heartCv = $('#heart');
  const hctx = heartCv.getContext('2d');
  let hw = 0, hh = 0;
  function fitHeart() {
    if (!heartCv) return;
    const r = heartCv.getBoundingClientRect();
    if (!r.width) return;
    hw = r.width; hh = r.height;
    heartCv.width = hw * DPR; heartCv.height = hh * DPR;
    hctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  const NODES = 13;
  function heartPt(t, cx, cy, k) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [cx + x * k, cy - y * k];
  }

  function drawHeart(p) {
    if (!hw) return;
    hctx.clearRect(0, 0, hw, hh);
    const cx = hw / 2, cy = hh * .47;
    const k = Math.min(hw / 40, hh / 40);
    const pts = [];
    for (let i = 0; i <= NODES; i++) pts.push(heartPt(i / NODES * Math.PI * 2 - Math.PI * .5 + .35, cx, cy, k));

    // 柔光
    const glow = hctx.createRadialGradient(cx, cy, 0, cx, cy, k * 20);
    glow.addColorStop(0, `rgba(255,140,180,${.10 + p * .10})`);
    glow.addColorStop(1, 'rgba(255,140,180,0)');
    hctx.fillStyle = glow;
    hctx.fillRect(0, 0, hw, hh);

    // 连线
    const total = pts.length - 1;
    const show = p * total;
    hctx.lineWidth = 1.1;
    hctx.strokeStyle = 'rgba(255,200,220,.62)';
    hctx.shadowColor = 'rgba(255,143,177,.9)';
    hctx.shadowBlur = 12;
    hctx.beginPath();
    hctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i <= total; i++) {
      if (i <= show) hctx.lineTo(pts[i][0], pts[i][1]);
      else if (i - 1 < show) {
        const f = show - (i - 1);
        hctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f,
                    pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f);
        break;
      }
    }
    hctx.stroke();
    hctx.shadowBlur = 0;

    // 节点星
    pts.forEach((pt, i) => {
      const on = (i / total) <= p;
      const tw = .7 + .3 * Math.sin(performance.now() * .0018 + i);
      const r = on ? 2.1 * tw + .9 : .9;
      hctx.beginPath(); hctx.arc(pt[0], pt[1], r, 0, 6.2832);
      hctx.fillStyle = on ? 'rgba(255,246,250,.96)' : 'rgba(255,214,230,.28)';
      hctx.shadowColor = 'rgba(255,143,177,.95)'; hctx.shadowBlur = on ? 14 : 4;
      hctx.fill(); hctx.shadowBlur = 0;
      if (on && i % 2 === 0) {
        hctx.beginPath(); hctx.arc(pt[0], pt[1], r * 4.5, 0, 6.2832);
        hctx.fillStyle = 'rgba(255,143,177,.09)'; hctx.fill();
      }
    });
  }

  /* ---------- 主循环 ---------- */
  let csP = 0, targetCs = 0;
  const csSection = $('#sCs');
  function frame(t) {
    drawSky(t);
    // 星座随滚动生长
    if (csSection) {
      const r = csSection.getBoundingClientRect();
      const vh = innerHeight;
      targetCs = clamp((vh * .82 - r.top) / (vh * .58), 0, 1);
    }
    csP += (targetCs - csP) * .10;
    if (Math.abs(targetCs - csP) < .002) csP = targetCs;
    drawHeart(csP);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 滚动进度 ---------- */
  const bar = $('#bar i');
  story.addEventListener('scroll', () => {
    const max = story.scrollHeight - story.clientHeight;
    scrollP = max > 0 ? story.scrollTop / max : 0;
    bar.style.transform = `scaleX(${clamp(scrollP, 0, 1)})`;
    // 滚动时若按钮已逃逸，拉回来
    if (btnDodge.classList.contains('floating')) resetDodge();
  }, { passive: true });

  /* ---------- 天数 ---------- */
  function days() {
    const s = new Date(CONFIG.startDate + 'T00:00:00');
    if (isNaN(s)) return null;
    return Math.max(1, Math.floor((Date.now() - s) / 86400000) + 1);
  }
  const dEl = $('#dayNum'), dWrap = $('#days');
  const totalDays = days();
  if (totalDays == null) dWrap.style.display = 'none';
  else {
    const io2 = new IntersectionObserver(en => {
      if (en[0].isIntersecting) {
        let cur = 0, step = Math.ceil(totalDays / 34);
        const tick = () => {
          cur = Math.min(totalDays, cur + step);
          dEl.textContent = cur;
          if (cur < totalDays) requestAnimationFrame(tick);
        };
        tick(); io2.disconnect();
      }
    }, { threshold: .4 });
    io2.observe(dWrap);
  }

  /* ---------- 尾声日期 ---------- */
  const now = new Date();
  $('#stamp').textContent = `${now.getFullYear()} . ${String(now.getMonth() + 1).padStart(2, '0')} . ${String(now.getDate()).padStart(2, '0')}`;

  /* ---------- 「再想想」逃跑 ---------- */
  const btnYes = $('#btnYes');
  const btnDodge = $('#btnDodge');
  const actions = $('.actions');
  let dodges = 0;

  function resetDodge() {
    btnDodge.classList.remove('floating');
    btnDodge.style.cssText = '';
    // 清掉占位
    const sp = document.getElementById('dodgeSpacer');
    if (sp) sp.remove();
  }

  function dodge() {
    if (dodges >= 5) return;
    if (!btnDodge.classList.contains('floating')) {
      const r = btnDodge.getBoundingClientRect();
      const sp = document.createElement('div');
      sp.id = 'dodgeSpacer';
      sp.style.width = r.width + 'px';
      sp.style.height = r.height + 'px';
      sp.style.marginLeft = 'auto';
      btnDodge.after(sp);
      btnDodge.classList.add('floating');
      btnDodge.style.left = r.left + 'px';
      btnDodge.style.top = r.top + 'px';
    }
    dodges++;
    const w = btnDodge.offsetWidth, h = btnDodge.offsetHeight, pad = 14;
    const x = pad + Math.random() * (innerWidth - w - pad * 2);
    const y = pad + 60 + Math.random() * (innerHeight - h - pad * 2 - 80);
    btnDodge.style.left = x + 'px';
    btnDodge.style.top = y + 'px';
    btnDodge.style.transform = `scale(${Math.max(.58, 1 - dodges * .1)}) rotate(${(Math.random() * 14 - 7)}deg)`;
    const words = ['再想想', '我躲', '抓不到我', '真的不想想？', '……它跑了'];
    btnDodge.textContent = words[Math.min(dodges, words.length - 1)];
    if (dodges >= 5) {
      btnDodge.style.opacity = '0';
      setTimeout(() => { resetDodge(); }, 600);
    }
    try { navigator.vibrate && navigator.vibrate(6); } catch (e) {}
  }

  ['pointerdown', 'pointerenter'].forEach(ev => {
    btnDodge.addEventListener(ev, e => {
      if (ev === 'pointerenter' && e.pointerType !== 'mouse') return;
      e.preventDefault(); dodge();
    }, { passive: false });
  });

  /* ---------- 点「好呀」 ---------- */
  function burst(n) {
    const W2 = innerWidth, H2 = innerHeight;
    const colors = ['#ffb0c9', '#ff8fb1', '#ffd9e6', '#fff1f6', '#ffc2d6'];
    for (let i = 0; i < n; i++) {
      parts.push({
        x: W2 / 2 + (Math.random() - .5) * W2 * .5,
        y: H2 * .62 + (Math.random() - .5) * 80,
        vx: (Math.random() - .5) * 9,
        vy: -Math.random() * 12 - 4,
        g: .16 + Math.random() * .1,
        s: 5 + Math.random() * 9,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * .16,
        life: 1,
        decay: .0035 + Math.random() * .004,
        c: colors[(Math.random() * colors.length) | 0],
        type: Math.random() > .35 ? 'heart' : 'dot'
      });
    }
  }

  btnYes.addEventListener('click', () => {
    const fin = $('#finale');
    fin.classList.add('show');
    burst(90);
    try { navigator.vibrate && navigator.vibrate([0, 30, 50, 30, 70]); } catch (e) {}
    setTimeout(() => burst(50), 700);
  });

  /* ---------- 藏起来的那封信（点 × 打开） ---------- */
  const letterEl = $('#letter');
  const letterBody = $('#letterBody');
  const letterPaper = letterEl.querySelector('.paper');
  let letterBuilt = false;

  function buildLetter() {
    const L = CONFIG.letter || {};
    $('#letterTo').textContent = L.to || (CONFIG.girl + '：');
    letterBody.innerHTML = (L.lines || []).map((line, i) => {
      if (!String(line).trim()) return '<div class="gap"></div>';
      const d = (.32 + i * .19).toFixed(2);
      return `<p class="ln" style="--d:${d}s">${line}</p>`;
    }).join('');
    $('#letterSign').textContent = '—— ' + CONFIG.boy;
    $('#letterSeal').textContent = (L.seal || CONFIG.boy.slice(-1) || '心').slice(0, 1);
    letterBuilt = true;
  }

  function openLetter() {
    if (!letterBuilt) buildLetter();
    letterPaper.scrollTop = 0;
    letterEl.classList.add('show');
    try { navigator.vibrate && navigator.vibrate([0, 14, 40, 14]); } catch (e) {}
    if (Music && Music.chime) Music.chime();
  }

  function closeLetter() { letterEl.classList.remove('show'); }

  $('#btnX').addEventListener('click', e => { e.stopPropagation(); openLetter(); });
  letterEl.addEventListener('click', e => {
    if (!e.target.closest('.paper')) closeLetter();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLetter(); });

  /* ---------- 音乐（WebAudio 合成，无版权） ---------- */
  const Music = {
    ctx: null, on: false, timer: null, step: 0, next: 0,
    init() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      const c = this.ctx;
      this.master = c.createGain(); this.master.gain.value = .68;
      // 空间感：延迟 + 反馈
      const dly = c.createDelay(1), fb = c.createGain(), wet = c.createGain();
      dly.delayTime.value = .34; fb.gain.value = .30; wet.gain.value = .28;
      dly.connect(fb); fb.connect(dly);
      this.master.connect(c.destination);
      this.master.connect(dly); dly.connect(wet); wet.connect(c.destination);
      return true;
    },
    freq(m) { return 440 * Math.pow(2, (m - 69) / 12); },
    note(m, t, dur, vel) {
      const c = this.ctx;
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vel, t + .012);
      g.gain.exponentialRampToValueAtTime(.0008, t + dur);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = .6;
      [['sine', 1], ['triangle', .32]].forEach(([type, mix]) => {
        const o = c.createOscillator();
        o.type = type; o.frequency.value = this.freq(m);
        const og = c.createGain(); og.gain.value = mix;
        o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + .05);
      });
      lp.connect(g); g.connect(this.master);
    },
    chime() {                                   // 拆信时的一声轻铃
      if (!this.ctx && !this.init()) return;
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const t = this.ctx.currentTime + .02;
      this.note(84, t, 3.0, .085);
      this.note(91, t + .16, 2.2, .045);
      this.note(96, t + .34, 1.8, .028);
    },
    schedule() {
      const c = this.ctx;
      // Am - F - C - G，慢速琶音
      const prog = [[45, 52, 57, 60, 64], [41, 48, 53, 57, 60], [48, 55, 60, 64, 67], [43, 50, 55, 59, 62]];
      const pat = [0, 2, 3, 4, 3, 2, 1, 2];
      const beat = 60 / 62;
      while (this.next < c.currentTime + .5) {
        const bar = Math.floor(this.step / 8) % 4;
        const ch = prog[bar];
        const idx = pat[this.step % 8];
        const t = this.next;
        this.note(ch[idx], t, 2.2, .10);
        if (this.step % 8 === 0) this.note(ch[0] - 12, t, 3.4, .12);
        if (this.step % 8 === 4) this.note(ch[3] + 12, t, 1.8, .05);
        this.next += beat;
        this.step++;
      }
    },
    start() {
      if (!this.ctx && !this.init()) return;
      if (this.ctx.state === 'suspended') this.ctx.resume();
      this.on = true;
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setTargetAtTime(.68, this.ctx.currentTime, .8);
      if (!this.timer) {
        this.next = this.ctx.currentTime + .15;
        this.timer = setInterval(() => this.schedule(), 120);
        this.schedule();
      }
      $('#music').classList.add('on');
    },
    stop() {
      if (!this.ctx) return;
      this.on = false;
      this.master.gain.setTargetAtTime(0, this.ctx.currentTime, .35);
      $('#music').classList.remove('on');
    },
    toggle() { this.on ? this.stop() : this.start(); }
  };

  /* ---------- 播放控制：优先 mp3 文件，失败自动回落合成旋律 ---------- */
  let musicBooted = false;

  const Sound = {
    mode: null,            // 'file' | 'synth'
    on: false,
    el: null,
    fadeTimer: null,
    _guard: null,
    _failed: false,        // mp3 拿不到（不存在/解码失败）
    vol: Math.min(1, Math.max(0, CONFIG.musicVolume != null ? CONFIG.musicVolume : .55)),

    build() {
      if (this.el) return this.el;
      const a = new Audio();
      a.loop = true;
      a.preload = 'auto';
      a.volume = 0;
      a.src = CONFIG.music;
      a.addEventListener('error', () => {
        this._failed = true;
        if (musicBooted) this.useFallback();
      });
      this.el = a;
      return a;
    },

    start() {
      if (this.on) return;
      if (CONFIG.music && !this._failed) {
        const a = this.build();
        this.mode = 'file';
        this.on = true;
        $('#music').classList.add('on');
        const p = a.play();
        if (p && p.catch) p.catch(() => { this._failed = true; this.useFallback(); });
        this.fadeTo(this.vol);
        // 只有「确实拿不到音源」才回落；网络慢、还在缓冲不算
        clearTimeout(this._guard);
        this._guard = setTimeout(() => {
          if (!this.el || this.mode !== 'file') return;
          if (this.el.readyState === 0 && this.el.networkState === 3) {
            this._failed = true;
            this.useFallback();
          }
        }, 5000);
        return;
      }
      this.useFallback();
    },

    useFallback() {
      if (this.mode === 'synth') return;
      if (this.el) { try { this.el.pause(); } catch (e) {} }
      this.mode = 'synth';
      this.on = true;
      Music.start();
      $('#music').classList.add('on');
    },

    fadeTo(v) {
      const a = this.el;
      if (!a) return;
      clearInterval(this.fadeTimer);
      this.fadeTimer = setInterval(() => {
        const d = v - a.volume;
        if (Math.abs(d) < .02) { a.volume = v; clearInterval(this.fadeTimer); return; }
        a.volume = Math.min(1, Math.max(0, a.volume + d * .12));
      }, 60);
    },

    stop() {
      this.on = false;
      $('#music').classList.remove('on');
      if (this.mode === 'synth') { Music.stop(); return; }
      const a = this.el;
      if (!a) return;
      clearInterval(this.fadeTimer);
      const id = setInterval(() => {
        a.volume = Math.max(0, a.volume - .06);
        if (a.volume <= .005) { a.pause(); clearInterval(id); }
      }, 50);
    },

    toggle() { this.on ? this.stop() : this.start(); }
  };

  function bootMusic() {
    if (musicBooted) return;
    musicBooted = true;
    Sound.start();
  }
  // 首次交互才启动（绕过浏览器自动播放限制）
  ['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
    document.addEventListener(ev, e => {
      if (e.target && e.target.closest && e.target.closest('#music')) return;
      bootMusic();
    }, { passive: true }));
  $('#music').addEventListener('click', e => {
    e.stopPropagation();
    if (!musicBooted) { musicBooted = true; Sound.start(); }
    else Sound.toggle();
  });

  // 页面切到后台就暂停，回来接着放
  document.addEventListener('visibilitychange', () => {
    if (Sound.mode !== 'file' || !Sound.el) return;
    if (document.hidden) { Sound._wasOn = Sound.on; if (Sound.on) Sound.el.pause(); }
    else if (Sound._wasOn && Sound.on) { Sound.el.play().catch(() => {}); Sound._wasOn = false; }
  });

  /* 页面一进来就开始缓冲音乐（不出声，出声要等她第一次触碰） */
  if (CONFIG.music) Sound.build();

  /* ---------- 尺寸 ---------- */
  sizeSky();
  addEventListener('resize', () => { sizeSky(); });
  addEventListener('orientationchange', () => setTimeout(sizeSky, 260));

  /* 防止 iOS 橡皮筋 */
  document.addEventListener('touchmove', e => {
    if (e.target.closest('#story')) return;
    e.preventDefault();
  }, { passive: false });
})();
</script>
</body>
</html>
